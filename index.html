<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Ghost Radio</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>Ghost Pixel Station</h1>
    <p class="subtitle">[ SUPABASE MULTIPLAYER OPERATIONAL ]</p>

    <!-- Arcade Cabinet Container -->
    <div class="arcade-cabinet">
        <!-- Main Canvas Screen -->
        <canvas id="game-screen" width="512" height="320"></canvas>

        <!-- Command Control Panel -->
        <div id="deck-controls">
            <div class="input-row">
                <input type="text" id="ghostName" placeholder="NAME YOUR GHOST..." maxlength="10">
                <button class="btn" id="openStudioBtn">Draw Smooth Accessory</button>
            </div>
            <div class="input-row">
                <input type="text" id="trackUrl" placeholder="PASTE MP3 LINK (OR LEAVE BLANK)...">
                <button class="btn btn-summon" id="summonBtn">Summon Ghost</button>
            </div>
        </div>
    </div>

    <!-- Smooth Vector Drawing Modal -->
    <div id="studio-modal">
        <div class="studio-box">
            <h3>SMOOTH ACCESSORY EDITOR</h3>
            <p>DRAW HIGH-RES FLOWERS OR HATS HERE</p>
            
            <canvas id="drawCanvas" width="128" height="128"></canvas>
            
            <div class="palette">
                <div class="color-swatch active" data-color="#ff4757" style="background: #ff4757;"></div>
                <div class="color-swatch" data-color="#ffa502" style="background: #ffa502;"></div>
                <div class="color-swatch" data-color="#2ed573" style="background: #2ed573;"></div>
                <div class="color-swatch" data-color="#00d2d3" style="background: #00d2d3;"></div>
                <div class="color-swatch" data-color="#ffffff" style="background: #ffffff;"></div>
            </div>
            <div class="input-row">
                <button class="btn btn-cancel" id="cancelStudioBtn">Cancel</button>
                <button class="btn btn-bake" id="bakeAssetBtn">Save Asset</button>
            </div>
        </div>
    </div>

    <audio id="streamPlayer" preload="auto" crossorigin="anonymous"></audio>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
