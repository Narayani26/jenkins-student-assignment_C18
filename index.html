<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Ghost Station 🌌</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>

    <!-- Audio Stream Element -->
    <audio id="streamPlayer" crossorigin="anonymous"></audio>

    <!-- Master Mute Button -->
    <button id="muteToggleBtn" class="mute-btn" title="Toggle Mute">🔊</button>

    <!-- Canvas Screen -->
    <canvas id="game-screen"></canvas>

    <!-- Floating UI Deck -->
    <div id="floating-deck">
        <div class="control-group">
            <input type="text" id="ghostName" placeholder="GHOST NAME..." maxlength="12">
            <input type="text" id="ghostQuote" placeholder="VIBE QUOTE (E.G. BOO!)..." maxlength="18">
            <button class="btn" id="openStudioBtn">🌸 DRAW</button>
        </div>
        <div class="control-group">
            <input type="text" id="trackUrl" placeholder="PASTE YOUTUBE / SPOTIFY / MP3 LINK...">
            <label for="audioFileInput" class="btn file-label">📁 FILE</label>
            <input type="file" id="audioFileInput" accept="audio/*">
            <button class="btn btn-summon" id="summonBtn">SUMMON 👻</button>
            <button class="btn btn-share" id="shareBtn" title="Share Current Active Ghost">🔗 SHARE</button>
        </div>
    </div>

    <!-- Drawing Studio Modal -->
    <div id="studio-modal">
        <div class="studio-box">
            <h3>DESIGN ACCESSORY</h3>
            <canvas id="drawCanvas" width="160" height="160"></canvas>
            <div class="palette">
                <div class="color-swatch active" data-color="#ff4757" style="background: #ff4757;"></div>
                <div class="color-swatch" data-color="#2ed573" style="background: #2ed573;"></div>
                <div class="color-swatch" data-color="#1e90ff" style="background: #1e90ff;"></div>
                <div class="color-swatch" data-color="#ffa502" style="background: #ffa502;"></div>
                <div class="color-swatch" data-color="#ffffff" style="background: #ffffff;"></div>
                <div class="color-swatch" data-color="transparent" style="background: #1e1233; border: 1px dashed #aaa;">🧹</div>
            </div>
            <div class="studio-actions">
                <button class="btn btn-cancel" id="cancelStudioBtn">CANCEL</button>
                <button class="btn btn-bake" id="bakeAssetBtn">BAKE 🌸</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
